name: Windows release build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_ref:
        required: false
        type: string
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach the Windows ZIP to
        required: true
        default: v2.1.1
      source_ref:
        description: Source commit or branch (empty builds the release tag)
        required: false
      publish:
        description: Replace the asset on an existing Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
        working-directory: source
    steps:
      - name: Check out packaging tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
          path: source
      - name: Install native Windows toolchain and libraries
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_net
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-libwebsockets
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Build Windows x64 executable
        run: make -j2 CC='gcc -pthread' OS=Windows_NT openchess.exe
      - name: Run native rules, network and GUI regression tests
        run: |
          drive="$(cygpath -m "$PWD" | cut -c1)"
          mkdir -p "/${drive,,}/tmp/openchess-test-data"
          export APPDATA="$drive:/tmp/openchess-test-data"
          export OPENCHESS_ASSETS="$(cygpath -m "$PWD/assets")"
          # SDL's Windows entry point requires argc/argv in the test mains.
          # Only the tests are adapted; the release executable stays unchanged.
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('test_gui.c', 'test_local.c', 'test_ui21.c'):
              p = Path('tests') / name
              if not p.exists():
                  continue
              s = p.read_text()
              old = 'int main(void)\n{'
              if old not in s:
                  if re.search(r'int\s+main\s*\(\s*int\s+argc\s*,\s*char\s*\*\s*\*\s*argv\s*\)', s):
                      continue
                  raise SystemExit('Unexpected test entry point: ' + name)
              p.write_text(s.replace(old, 'int main(int argc, char **argv)\n{\n    (void)argc; (void)argv;'))
          PY
          tests='rules fen pgn ai engine_install transport proto puzzle review opening movetree net local gui'
          for extra in workspace ui21; do if [ -f tests/test_$extra.c ]; then tests="$tests $extra"; fi; done
          targets=''
          for test in $tests; do targets="$targets tests/test_$test"; done
          make -j2 CC='gcc -pthread -include ../scripts/windows-test-env.h' OS=Windows_NT $targets
          for test in $tests; do ./tests/test_$test.exe; done
      - name: Verify official Stockfish installation and UCI handshake
        run: |
          destination="$(cygpath -m "$PWD/dist/stockfish-install-test")"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File assets/engine/install-stockfish.ps1 -Destination "$destination"
          printf 'uci\nquit\n' | ./dist/stockfish-install-test/stockfish.exe > dist/stockfish-uci.txt
          grep -q '^uciok' dist/stockfish-uci.txt
          # A second invocation reuses the installed engine.
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File assets/engine/install-stockfish.ps1 -Destination "$destination"
      - name: Bundle, verify and upload portable Windows ZIP
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref || inputs.release_tag }}
          OPENCHESS_PACKAGE_ONLY: ${{ inputs.publish && '0' || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: python ../scripts/package_windows.py . "$(cygpath -m /ucrt64/bin)" "$RELEASE_TAG"
      - name: Retain verified Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenChess-Windows-x64
          path: source/dist/*.zip
          retention-days: 14
